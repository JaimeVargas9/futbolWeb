<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joma Futbol</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ──────────────────────────────────────────── */
    :root {
      --purple:       #7C3AED;
      --purple-light: #A78BFA;
      --blue:         #4F46E5;
      --text:         rgba(255,255,255,0.92);
      --muted:        rgba(255,255,255,0.42);
      --red:          #EF4444;
    }

    /* ── Base ───────────────────────────────────────────────────── */
    html, body {
      height: 100%; background: #000; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI',
                   Inter, system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Video layer ────────────────────────────────────────────── */
    #video-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    #stream {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    /* ── Hidden audio element ───────────────────────────────────── */
    /* audio element is invisible — managed entirely by JS */

    /* ── Waiting / state overlay ────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.9rem; text-align: center; padding: 2rem;
      background: radial-gradient(ellipse 80% 60% at 50% 30%,
                    rgba(124,58,237,0.08) 0%,
                    #07070F 65%);
      transition: opacity 0.4s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    /* Brand mark inside overlay */
    .overlay-brand {
      position: absolute; top: 2rem; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 0.55rem;
    }
    .overlay-brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(145deg, #7C3AED, #4338CA);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(124,58,237,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .overlay-brand-name {
      font-size: 1.35rem; font-weight: 800; letter-spacing: -0.04em;
      background: linear-gradient(135deg, #C4B5FD 20%, #93C5FD 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* State icon container */
    .overlay-icon {
      width: 68px; height: 68px; border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.25rem;
    }

    #overlay-title {
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 700; letter-spacing: -0.025em;
    }
    #overlay-msg {
      font-size: 0.88rem; color: var(--muted);
      max-width: 330px; line-height: 1.68;
    }

    /* Spinner */
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(255,255,255,0.08);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Unmute overlay ─────────────────────────────────────────── */
    /* Shown when browser blocks autoplay with audio (mobile policy).
       Tap anywhere to dismiss and start audio.                      */
    #unmute-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; cursor: pointer;
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: opacity 0.3s ease;
    }
    #unmute-overlay.hidden { opacity: 0; pointer-events: none; }

    .unmute-ring {
      width: 84px; height: 84px; border-radius: 50%;
      background: rgba(255,255,255,0.09);
      border: 1.5px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      animation: ring-pulse 2.2s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 24px rgba(124,58,237,0.18); }
      50%       { transform: scale(1.07); box-shadow: 0 0 44px rgba(124,58,237,0.38); }
    }
    #unmute-overlay p {
      font-size: 1.05rem; font-weight: 600; color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    #unmute-overlay small {
      font-size: 0.78rem; color: rgba(255,255,255,0.5);
    }

    /* ── HUD — live badge ───────────────────────────────────────── */
    #hud {
      position: fixed; top: 1.25rem; left: 1.25rem; z-index: 20;
      display: flex; align-items: center; gap: 0.45rem;
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.32rem 0.72rem 0.32rem 0.52rem;
      opacity: 0; transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #hud.visible { opacity: 1; }

    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--red);
      animation: live-blink 1.6s ease-in-out infinite;
    }
    @keyframes live-blink {
      0%, 100% { opacity: 1;   box-shadow: 0 0 7px rgba(239,68,68,0.75); }
      50%       { opacity: 0.3; box-shadow: none; }
    }
    #hud-text {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #fff;
    }

    /* ── Bottom controls bar ────────────────────────────────────── */
    #controls {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 3.5rem 1.5rem 1.5rem;
      background: linear-gradient(to top,
                    rgba(0,0,0,0.82) 0%,
                    rgba(0,0,0,0)    100%);
      display: flex; align-items: center; gap: 0.75rem;
      opacity: 0; transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #controls.visible { opacity: 1; pointer-events: auto; }

    .ctrl-btn {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.11);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover  { background: rgba(255,255,255,0.18); }
    .ctrl-btn:active { transform: scale(0.9); }
    .ctrl-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.55);
      outline-offset: 2px;
    }

    #btn-volume     { }
    #btn-fullscreen { margin-left: auto; }

    /* ── Screen reader only ─────────────────────────────────────── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>

  <!-- Video player — always muted; audio handled by separate <audio> element -->
  <div id="video-container" aria-label="Stream">
    <video id="stream" autoplay playsinline muted
           aria-label="Stream de pantalla remota"></video>
  </div>

  <!-- Separate audio element — play() called inside user gesture for iOS -->
  <audio id="audio-stream" playsinline></audio>

  <!-- Waiting / error / state overlay -->
  <div id="overlay" role="status">
    <!-- Brand mark (decorative) -->
    <div class="overlay-brand" aria-hidden="true">
      <div class="overlay-brand-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 16.1A5 5 0 0 1 5.9 20"/>
          <path d="M2 12.05A9 9 0 0 1 9.95 20"/>
          <path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
          <line x1="2" y1="20" x2="2.01" y2="20"/>
        </svg>
      </div>
      <span class="overlay-brand-name">beam</span>
    </div>

    <!-- State icon (decorative) -->
    <div class="overlay-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round"
           style="opacity:.5">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>

    <h1 id="overlay-title">Esperando emisión…</h1>
    <p id="overlay-msg">Conectado a la red local. En cuanto el emisor comparta pantalla verás el stream aquí.</p>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
  </div>

  <!-- Unmute overlay — appears only when autoplay audio is blocked -->
  <div id="unmute-overlay" class="hidden" role="button" tabindex="0"
       aria-label="Toca para activar el sonido">
    <div class="unmute-ring" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
           stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
    <p>Toca para activar el sonido</p>
    <small>El vídeo ya está reproduciéndose sin sonido</small>
  </div>

  <!-- Live badge (top-left) -->
  <div id="hud" aria-hidden="true">
    <span class="live-dot"></span>
    <span id="hud-text">En directo</span>
  </div>

  <!-- Controls bar (bottom) -->
  <div id="controls" aria-hidden="true">
    <button class="ctrl-btn" id="btn-volume" aria-label="Silenciar">
      <!-- Speaker on -->
      <svg id="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <!-- Speaker muted (hidden by default) -->
      <svg id="icon-sound-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" style="display:none">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="btn-fullscreen" aria-label="Pantalla completa">
      <svg id="icon-expand" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3"  y1="21" x2="10" y2="14"/>
      </svg>
      <svg id="icon-collapse" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" style="display:none">
        <polyline points="4 14 10 14 10 20"/>
        <polyline points="20 10 14 10 14 4"/>
        <line x1="10" y1="14" x2="3"  y2="21"/>
        <line x1="21" y1="3"  x2="14" y2="10"/>
      </svg>
    </button>
  </div>

  <div aria-live="assertive" aria-atomic="true" class="sr-only" id="sr-live"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const videoEl       = document.getElementById('stream');
    const audioEl       = document.getElementById('audio-stream');
    const overlay       = document.getElementById('overlay');
    const overlayTitle  = document.getElementById('overlay-title');
    const overlayMsg    = document.getElementById('overlay-msg');
    const spinner       = document.getElementById('spinner');
    const unmuteOverlay = document.getElementById('unmute-overlay');
    const hud           = document.getElementById('hud');
    const controls      = document.getElementById('controls');
    const btnVol        = document.getElementById('btn-volume');
    const iconSoundOn   = document.getElementById('icon-sound-on');
    const iconSoundOff  = document.getElementById('icon-sound-off');
    const btnFs         = document.getElementById('btn-fullscreen');
    const iconExpand    = document.getElementById('icon-expand');
    const iconCollapse  = document.getElementById('icon-collapse');
    const srLive        = document.getElementById('sr-live');

    // iOS Safari detection
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let pc         = null;
    let retryTimer = null;

    const iceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ],
    };

    // ── SDP patcher (same as broadcaster) ────────────────────────────────────
    function patchSdpForLAN(sdp) {
      const MAX_KBPS   = 50_000;
      const START_KBPS = 15_000;
      const lines = sdp.split('\r\n');
      const out   = [];
      let inVideo = false, bDone = false;
      const videoPTs = new Set();
      const hasFmtp  = new Set();

      let sec = '';
      for (const line of lines) {
        if (line.startsWith('m=')) sec = line.startsWith('m=video') ? 'video' : 'other';
        if (sec === 'video') {
          if (line.startsWith('m=video')) line.split(' ').slice(3).forEach(pt => videoPTs.add(pt));
          const fm = line.match(/^a=fmtp:(\d+)/);
          if (fm && videoPTs.has(fm[1])) hasFmtp.add(fm[1]);
        }
      }

      const injected = new Set();
      for (const line of lines) {
        if (line.startsWith('m=video'))  { inVideo = true;  bDone = false; }
        if (line.startsWith('m=') && !line.startsWith('m=video')) inVideo = false;
        if (inVideo && line.startsWith('b=')) continue;
        out.push(line);
        if (inVideo && !bDone && line.startsWith('m=video')) {
          out.push(`b=AS:${MAX_KBPS}`); out.push(`b=TIAS:${MAX_KBPS * 1000}`); bDone = true;
        }
        if (inVideo && line.startsWith('a=fmtp:')) {
          const m = line.match(/^a=fmtp:(\d+) (.*)$/);
          if (m && videoPTs.has(m[1]) && !m[2].includes('x-google-max-bitrate')) {
            out[out.length-1] = `a=fmtp:${m[1]} ${m[2]};x-google-start-bitrate=${START_KBPS};x-google-max-bitrate=${MAX_KBPS}`;
            injected.add(m[1]);
          }
        }
        if (inVideo && line.startsWith('a=rtpmap:')) {
          const m = line.match(/^a=rtpmap:(\d+) ([^/\r\n]+)/);
          if (m && videoPTs.has(m[1]) && !hasFmtp.has(m[1]) && !injected.has(m[1])) {
            const codec = m[2].toLowerCase();
            if (['vp8','vp9','h264','av1'].some(c => codec.startsWith(c))) {
              out.push(`a=fmtp:${m[1]} x-google-start-bitrate=${START_KBPS};x-google-max-bitrate=${MAX_KBPS}`);
              injected.add(m[1]);
            }
          }
        }
      }
      return out.join('\r\n');
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function announce(msg) { srLive.textContent = ''; requestAnimationFrame(() => srLive.textContent = msg); }

    function showOverlay(title, msg, spin = true) {
      overlayTitle.textContent = title;
      overlayMsg.textContent   = msg;
      spinner.style.display    = spin ? 'block' : 'none';
      overlay.classList.remove('hidden');
      hud.classList.remove('visible');
      controls.classList.remove('visible');
      hud.setAttribute('aria-hidden', 'true');
      controls.setAttribute('aria-hidden', 'true');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
      hud.setAttribute('aria-hidden', 'false');
      controls.setAttribute('aria-hidden', 'false');
      showControls();
    }

    // ── Auto-hide controls ────────────────────────────────────────────────────

    let hideTimer = null;
    function showControls() {
      hud.classList.add('visible');
      controls.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        hud.classList.remove('visible');
        controls.classList.remove('visible');
      }, 3000);
    }
    document.addEventListener('mousemove', () => { if (overlay.classList.contains('hidden')) showControls(); });
    document.addEventListener('touchstart', () => { if (overlay.classList.contains('hidden')) showControls(); }, { passive: true });

    // ── Audio: separate <audio> element strategy ──────────────────────────────
    //
    // iOS Safari CANNOT unmute a <video> that started playing muted — no amount
    // of `videoEl.muted = false` inside a click handler will unlock audio there.
    // The only reliable cross-platform approach:
    //
    //   • <video> stays permanently muted  → autoplay works everywhere, no policy.
    //   • <audio> gets the audio tracks   → we call audioEl.play() directly inside
    //     the user-gesture handler, which iOS allows.
    //
    // This pattern works on Chrome, Firefox, Safari desktop, and iOS Safari 14+.
    //
    let audioMuted = false;

    function updateVolumeIcon() {
      iconSoundOn.style.display  = audioMuted ? 'none' : '';
      iconSoundOff.style.display = audioMuted ? ''     : 'none';
      btnVol.setAttribute('aria-label', audioMuted ? 'Activar sonido' : 'Silenciar');
    }

    // Called when audio tracks arrive or on user tap of the unmute overlay.
    // Must be synchronous at the point of audioEl.play() for iOS gesture policy.
    function startAudio() {
      audioEl.muted  = false;
      audioEl.volume = 1;
      audioMuted = false;
      audioEl.play().then(() => {
        unmuteOverlay.classList.add('hidden');
        updateVolumeIcon();
        announce('Sonido activado');
      }).catch(() => {
        // Still blocked — shouldn't happen if called from gesture, but show overlay
        unmuteOverlay.classList.remove('hidden');
        updateVolumeIcon();
      });
    }

    // Attach audio tracks to the <audio> element and attempt playback
    function attachAudio(stream) {
      const audioTracks = stream.getAudioTracks();
      if (!audioTracks.length) return; // no audio in this stream

      // Build a MediaStream with only audio tracks for the <audio> element
      const audioOnlyStream = new MediaStream(audioTracks);
      audioEl.srcObject = audioOnlyStream;

      audioEl.play().then(() => {
        unmuteOverlay.classList.add('hidden');
        updateVolumeIcon();
      }).catch(() => {
        // Autoplay blocked (expected on iOS/mobile without prior interaction)
        unmuteOverlay.classList.remove('hidden');
        updateVolumeIcon();
        announce('Toca la pantalla para activar el sonido.');
      });
    }

    // Unmute overlay: any tap calls startAudio() directly (iOS requires sync gesture)
    unmuteOverlay.addEventListener('click', startAudio);
    unmuteOverlay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') startAudio(); });

    // Volume button in controls bar
    btnVol.addEventListener('click', () => {
      if (audioMuted) {
        startAudio();
      } else {
        audioEl.pause();
        audioMuted = true;
        updateVolumeIcon();
      }
    });

    // ── Peer ─────────────────────────────────────────────────────────────────

    function closePeer() {
      if (pc) { pc.close(); pc = null; }
      videoEl.srcObject = null;
      audioEl.srcObject = null;
      audioEl.pause();
      unmuteOverlay.classList.add('hidden');
    }

    // ── Socket ────────────────────────────────────────────────────────────────

    const socket = io({ reconnection: true, reconnectionDelay: 2000, reconnectionDelayMax: 5000 });

    socket.on('connect', () => {
      clearTimeout(retryTimer);
      showOverlay('Buscando emisor…', 'Conectado al servidor. En cuanto el emisor comparta pantalla verás el stream aquí.', true);
      socket.emit('register-viewer');
    });

    socket.on('disconnect', () => {
      showOverlay('Reconectando…', 'Se perdió la conexión con el servidor.', true);
      announce('Conexión perdida. Reconectando…');
      closePeer();
    });

    socket.on('no-broadcaster', () => {
      showOverlay('Sin emisión activa', 'No hay nadie emitiendo ahora mismo. Esta página se actualizará automáticamente cuando empiece.', true);
      announce('Sin emisor activo. Esperando…');
    });

    socket.on('broadcaster-available', () => {
      showOverlay('Conectando…', 'Emisor detectado. Estableciendo conexión…', true);
      announce('Emisor detectado. Conectando…');
    });

    socket.on('broadcaster-left', () => {
      showOverlay('Emisión finalizada', 'El emisor ha detenido la transmisión.', false);
      announce('La emisión ha terminado.');
      closePeer();
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => socket.emit('register-viewer'), 6000);
    });

    socket.on('offer', async ({ fromId, sdp }) => {
      closePeer();
      pc = new RTCPeerConnection(iceConfig);

      // ontrack fires once per track (video, then audio).
      // We wait until the stream has both before doing anything.
      let tracksReceived = 0;

      pc.ontrack = ({ track, streams }) => {
        if (!streams[0]) return;
        tracksReceived++;

        if (track.kind === 'video') {
          // Video always plays muted — no policy issues
          videoEl.srcObject = streams[0];
          videoEl.muted = true;
          videoEl.play().catch(() => {});
          hideOverlay();
          announce('Stream conectado.');
        }

        if (track.kind === 'audio') {
          // Attach audio to the dedicated <audio> element
          attachAudio(streams[0]);
        }

        // Fallback: if we get a single combined track (some browsers/environments)
        // and no explicit audio track fires, attach audio from the full stream
        if (tracksReceived === 1 && track.kind === 'video') {
          // Attempt audio attachment from full stream after a short delay
          // (in case audio track event follows immediately)
          setTimeout(() => {
            if (streams[0].getAudioTracks().length > 0 && !audioEl.srcObject) {
              attachAudio(streams[0]);
            }
          }, 500);
        }
      };

      pc.onicecandidate = ({ candidate }) => {
        if (candidate) socket.emit('ice-candidate', { targetId: fromId, candidate });
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;
        if (pc.connectionState === 'failed') {
          showOverlay('Error de conexión', 'No se pudo establecer la conexión WebRTC. Reintentando…', true);
          closePeer();
          retryTimer = setTimeout(() => socket.emit('register-viewer'), 3000);
        }
        if (pc.connectionState === 'disconnected') {
          showOverlay('Reconectando stream…', 'Conexión interrumpida.', true);
        }
      };

      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
        const raw     = await pc.createAnswer();
        const patched = patchSdpForLAN(raw.sdp);
        const answer  = new RTCSessionDescription({ type: 'answer', sdp: patched });
        await pc.setLocalDescription(answer);
        socket.emit('answer', { targetId: fromId, sdp: pc.localDescription });
      } catch (e) {
        showOverlay('Error', 'No se pudo procesar la oferta: ' + e.message, false);
      }
    });

    socket.on('ice-candidate', async ({ candidate }) => {
      if (!pc || !candidate) return;
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch { }
    });

    // ── Fullscreen ────────────────────────────────────────────────────────────
    //
    // iOS Safari does NOT support the standard Fullscreen API on arbitrary elements.
    // The only working method on iOS is videoEl.webkitEnterFullscreen(), which puts
    // the native iOS video player in fullscreen.
    //
    // Detection matrix:
    //   isIOS → use videoEl.webkitEnterFullscreen / webkitExitFullscreen
    //   else  → use standard requestFullscreen / exitFullscreen with webkit fallbacks
    //

    function isInFullscreen() {
      return !!(document.fullscreenElement ||
                document.webkitFullscreenElement ||
                videoEl.webkitDisplayingFullscreen);
    }

    function toggleFullscreen() {
      if (isIOS) {
        // iOS: only the <video> element supports native fullscreen
        if (videoEl.webkitDisplayingFullscreen) {
          videoEl.webkitExitFullscreen?.();
        } else {
          videoEl.webkitEnterFullscreen?.();
        }
        return;
      }

      // All other browsers: standard API + webkit prefix fallback
      if (isInFullscreen()) {
        (document.exitFullscreen || document.webkitExitFullscreen)
          ?.call(document)
          .catch(() => {});
      } else {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen)
          ?.call(el)
          .catch(() => {});
      }
    }

    function onFsEnter() {
      iconExpand.style.display   = 'none';
      iconCollapse.style.display = '';
      btnFs.setAttribute('aria-label', 'Salir de pantalla completa');
      showControls();
    }
    function onFsExit() {
      iconExpand.style.display   = '';
      iconCollapse.style.display = 'none';
      btnFs.setAttribute('aria-label', 'Pantalla completa');
      showControls();
    }

    // Standard fullscreen events
    document.addEventListener('fullscreenchange',       () => isInFullscreen() ? onFsEnter() : onFsExit());
    document.addEventListener('webkitfullscreenchange', () => isInFullscreen() ? onFsEnter() : onFsExit());

    // iOS-specific fullscreen events (fired on the <video> element)
    videoEl.addEventListener('webkitbeginfullscreen', onFsEnter);
    videoEl.addEventListener('webkitendfullscreen',   onFsExit);

    btnFs.addEventListener('click', toggleFullscreen);
    videoEl.addEventListener('dblclick', toggleFullscreen);

    updateVolumeIcon();
  </script>
</body>
</html>
