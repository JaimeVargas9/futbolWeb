<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joma Futbol</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ──────────────────────────────────────────── */
    :root {
      --bg:            #07070F;
      --surface:       rgba(255,255,255,0.04);
      --border:        rgba(255,255,255,0.07);
      --border-hover:  rgba(255,255,255,0.13);
      --purple:        #7C3AED;
      --purple-mid:    #8B5CF6;
      --purple-light:  #A78BFA;
      --blue:          #4F46E5;
      --text:          rgba(255,255,255,0.92);
      --muted:         rgba(255,255,255,0.4);
      --green:         #10B981;
      --red:           #EF4444;
      --radius-card:   20px;
      --radius-btn:    12px;
      --blur:          blur(24px) saturate(160%);
    }

    /* ── Base ───────────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI',
                   Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Background atmosphere ──────────────────────────────────── */
    .bg {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(110px);
    }
    .bg-orb-1 {
      width: 680px; height: 680px; opacity: 0.13;
      background: radial-gradient(circle, #7C3AED 0%, transparent 70%);
      top: -180px; left: -160px;
      animation: drift-a 14s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 480px; height: 480px; opacity: 0.11;
      background: radial-gradient(circle, #2563EB 0%, transparent 70%);
      bottom: -120px; right: -120px;
      animation: drift-b 11s ease-in-out infinite;
    }
    .bg-orb-3 {
      width: 320px; height: 320px; opacity: 0.07;
      background: radial-gradient(circle, #0EA5E9 0%, transparent 70%);
      top: 45%; left: 58%;
      animation: drift-a 18s ease-in-out infinite reverse;
    }
    @keyframes drift-a {
      0%, 100% { transform: translate(0,   0)   scale(1);    }
      33%       { transform: translate(40px, 22px) scale(1.06); }
      66%       { transform: translate(-18px,38px) scale(0.96); }
    }
    @keyframes drift-b {
      0%, 100% { transform: translate(0,    0)    scale(1);    }
      50%       { transform: translate(-30px,-22px) scale(1.09); }
    }

    /* ── Page layout ────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 2.75rem 1.25rem 4.5rem;
      gap: 0.875rem;
    }

    /* ── Brand ──────────────────────────────────────────────────── */
    .brand {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 0.25rem;
      animation: fade-up 0.55s cubic-bezier(.22,.8,.46,1) both;
    }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(145deg, #7C3AED, #4338CA);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 26px rgba(124,58,237,0.45),
                  inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .brand-name {
      font-size: 1.7rem; font-weight: 800; letter-spacing: -0.045em;
      background: linear-gradient(135deg, #C4B5FD 20%, #93C5FD 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Headlines ──────────────────────────────────────────────── */
    .headline {
      font-size: clamp(1.35rem, 4vw, 1.95rem);
      font-weight: 700; letter-spacing: -0.03em;
      text-align: center; line-height: 1.2;
      animation: fade-up 0.55s cubic-bezier(.22,.8,.46,1) 0.07s both;
    }
    .subline {
      font-size: 0.83rem; color: var(--muted);
      letter-spacing: 0.06em; text-align: center;
      animation: fade-up 0.55s cubic-bezier(.22,.8,.46,1) 0.12s both;
    }

    /* ── Glass card ─────────────────────────────────────────────── */
    .glass-card {
      width: 100%; max-width: 820px;
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      transition: border-color 0.3s ease;
      animation: fade-up 0.55s cubic-bezier(.22,.8,.46,1) 0.17s both;
    }
    .glass-card:hover { border-color: var(--border-hover); }
    .glass-card + .glass-card { animation-delay: 0.23s; }
    .glass-card + .glass-card + .glass-card { animation-delay: 0.29s; }

    /* ── Error banner ───────────────────────────────────────────── */
    #error-banner {
      display: none;
      width: 100%; max-width: 820px;
      background: rgba(239,68,68,0.09);
      border: 1px solid rgba(239,68,68,0.28);
      border-radius: 13px; padding: 0.75rem 1.1rem;
      font-size: 0.875rem; color: #FCA5A5;
      animation: fade-up 0.3s ease both;
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .controls-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    button {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.78rem 1.5rem;
      border: none; border-radius: var(--radius-btn);
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
      -webkit-font-smoothing: antialiased;
      transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
      position: relative; overflow: hidden;
    }
    button::after {
      content: ''; position: absolute; inset: 0;
      background: transparent; transition: background 0.15s;
      border-radius: inherit;
    }
    button:hover:not(:disabled)::after  { background: rgba(255,255,255,0.07); }
    button:active:not(:disabled) { transform: scale(0.97) !important; }
    button:focus-visible { outline: 2px solid var(--purple-light); outline-offset: 3px; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-start {
      background: linear-gradient(135deg, #7C3AED 0%, #4338CA 100%);
      color: #fff;
      box-shadow: 0 4px 22px rgba(124,58,237,0.38);
      flex: 1; min-width: 190px;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
    }
    #btn-start:not(:disabled) {
      background-size: 200% 200%;
      animation: btn-glow 4s ease infinite;
    }
    @keyframes btn-glow {
      0%, 100% { box-shadow: 0 4px 22px rgba(124,58,237,0.38); }
      50%       { box-shadow: 0 4px 32px rgba(124,58,237,0.62); }
    }
    #btn-start:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 30px rgba(124,58,237,0.56);
    }

    #btn-stop {
      background: rgba(239,68,68,0.1);
      color: #FCA5A5;
      border: 1px solid rgba(239,68,68,0.22);
    }
    #btn-stop:hover:not(:disabled) {
      background: rgba(239,68,68,0.18);
      border-color: rgba(239,68,68,0.38);
    }

    /* ── Preview ────────────────────────────────────────────────── */
    .preview-header {
      display: flex; align-items: center; gap: 0.45rem;
      margin-bottom: 0.875rem;
    }
    .preview-label {
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted);
    }
    .preview-wrapper {
      position: relative;
      background: #000; border-radius: 12px; overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
    }
    #preview { width: 100%; height: 100%; object-fit: contain; display: block; }
    .preview-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.75rem;
      color: var(--muted); font-size: 0.875rem;
    }
    .preview-placeholder svg { opacity: 0.22; }

    /* ── Footer note ────────────────────────────────────────────── */
    .footer-note {
      font-size: 0.75rem; color: var(--muted); text-align: center;
      opacity: 0.65; margin-top: 0.25rem;
      animation: fade-up 0.55s ease 0.38s both;
    }
    .footer-note kbd {
      font-family: inherit; font-size: 0.7rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 5px; padding: 0.1rem 0.45rem;
    }

    /* ── Screen reader only ─────────────────────────────────────── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ── Entrance animation ─────────────────────────────────────── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .page { padding: 1.75rem 1rem 3.5rem; gap: 0.75rem; }
      .brand-name { font-size: 1.45rem; }
      .headline { font-size: 1.25rem; }
      .glass-card { padding: 1rem 1.1rem; border-radius: 16px; }
      .controls-row { flex-direction: column; }
      #btn-start, #btn-stop { width: 100%; min-width: unset; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Atmospheric background -->
  <div class="bg" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <div class="page">

    <!-- Brand header -->
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 16.1A5 5 0 0 1 5.9 20"/>
          <path d="M2 12.05A9 9 0 0 1 9.95 20"/>
          <path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
          <line x1="2" y1="20" x2="2.01" y2="20"/>
        </svg>
      </div>
      <span class="brand-name">Joma Futbol</span>
    </header>

    <!-- Error banner -->
    <div id="error-banner" role="alert" aria-live="assertive"></div>

    <!-- Controls card -->
    <section class="glass-card" aria-label="Controles de emisión">
      <div class="controls-row">
        <button id="btn-start" disabled aria-label="Compartir pantalla">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Compartir pantalla
        </button>
        <button id="btn-stop" disabled aria-label="Detener emisión">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
          </svg>
          Detener
        </button>
      </div>
    </section>

    <!-- Preview card -->
    <section class="glass-card" aria-label="Vista previa de emisión">
      <div class="preview-header">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true" style="opacity:.35">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span class="preview-label">Vista previa</span>
      </div>
      <div class="preview-wrapper">
        <video id="preview" autoplay playsinline muted
               aria-label="Vista previa de pantalla compartida"></video>
        <div class="preview-placeholder" id="preview-placeholder" aria-hidden="true">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Sin emisión activa</span>
        </div>
      </div>
    </section>

    <p class="footer-note">
      Los espectadores acceden desde&nbsp;<kbd>http://&lt;tu-IP&gt;:3000/watch</kbd>
    </p>

  </div><!-- .page -->

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket      = io();
    const btnStart    = document.getElementById('btn-start');
    const btnStop     = document.getElementById('btn-stop');
    const preview     = document.getElementById('preview');
    const placeholder = document.getElementById('preview-placeholder');
    const errorBanner = document.getElementById('error-banner');

    const peers = new Map();
    let localStream = null;

    const iceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ],
    };

    // ── Helpers ───────────────────────────────────────────────────────────────

    function showError(msg) { errorBanner.textContent = msg; errorBanner.style.display = 'block'; }
    function clearError()   { errorBanner.textContent = ''; errorBanner.style.display = 'none'; }

    // ── SDP patcher — injects high bitrate AND Chrome-specific x-google params ──
    //
    // x-google-start-bitrate: Chrome begins encoding at this rate immediately.
    //   Without it Chrome ramps from ~300 kbps → minutes to reach full quality.
    // x-google-max-bitrate: hard ceiling Chrome won't exceed.
    // b=AS / b=TIAS: RFC-standard bandwidth hints respected by all browsers.
    //
    function patchSdpForLAN(sdp) {
      const MAX_KBPS   = 50_000;  // 50 Mbps — no quality concessions on LAN
      const START_KBPS = 15_000;  // 15 Mbps start → instant HD quality

      const lines = sdp.split('\r\n');
      const out   = [];
      let inVideo  = false;
      let bDone    = false;

      // Collect video payload types (numbers after port/protocol on m=video line)
      const videoPTs = new Set();
      // PTs that already have an fmtp line (we augment them, not duplicate)
      const hasFmtp  = new Set();

      // First pass: gather metadata
      let currentSection = '';
      for (const line of lines) {
        if (line.startsWith('m=')) currentSection = line.startsWith('m=video') ? 'video' : 'other';
        if (currentSection === 'video') {
          if (line.startsWith('m=video')) {
            line.split(' ').slice(3).forEach(pt => videoPTs.add(pt));
          }
          const fmtpM = line.match(/^a=fmtp:(\d+)/);
          if (fmtpM && videoPTs.has(fmtpM[1])) hasFmtp.add(fmtpM[1]);
        }
      }

      // Second pass: build patched SDP
      const injected = new Set();
      currentSection = '';

      for (const line of lines) {
        if (line.startsWith('m=video'))   { currentSection = 'video'; inVideo = true; bDone = false; }
        if (line.startsWith('m=') && !line.startsWith('m=video')) { currentSection = 'other'; inVideo = false; }

        // Remove existing bandwidth lines inside video section (we replace them)
        if (inVideo && line.startsWith('b=')) continue;

        out.push(line);

        // Inject b= lines immediately after m=video
        if (inVideo && !bDone && line.startsWith('m=video')) {
          out.push(`b=AS:${MAX_KBPS}`);
          out.push(`b=TIAS:${MAX_KBPS * 1000}`);
          bDone = true;
        }

        // Augment existing fmtp lines: append x-google params
        if (inVideo && line.startsWith('a=fmtp:')) {
          const m = line.match(/^a=fmtp:(\d+) (.*)$/);
          if (m && videoPTs.has(m[1]) && !m[2].includes('x-google-max-bitrate')) {
            // Replace the line we just pushed with the augmented version
            out[out.length - 1] =
              `a=fmtp:${m[1]} ${m[2]};x-google-start-bitrate=${START_KBPS};x-google-max-bitrate=${MAX_KBPS}`;
            injected.add(m[1]);
          }
        }

        // For video codecs WITHOUT an fmtp line, inject one right after a=rtpmap
        if (inVideo && line.startsWith('a=rtpmap:')) {
          const m = line.match(/^a=rtpmap:(\d+) ([^/\r\n]+)/);
          if (m && videoPTs.has(m[1]) && !hasFmtp.has(m[1]) && !injected.has(m[1])) {
            const codec = m[2].toLowerCase();
            if (['vp8','vp9','h264','av1'].some(c => codec.startsWith(c))) {
              out.push(`a=fmtp:${m[1]} x-google-start-bitrate=${START_KBPS};x-google-max-bitrate=${MAX_KBPS}`);
              injected.add(m[1]);
            }
          }
        }
      }

      return out.join('\r\n');
    }

    // ── Codec preference: H.264 (HW encoder) > VP8 > VP9 ────────────────────
    function applyCodecPreference(pc) {
      try {
        const caps = RTCRtpSender.getCapabilities?.('video');
        if (!caps) return;
        for (const t of pc.getTransceivers()) {
          if (t.sender?.track?.kind !== 'video') continue;
          const h264   = caps.codecs.filter(c => c.mimeType === 'video/H264');
          const vp8    = caps.codecs.filter(c => c.mimeType === 'video/VP8');
          const vp9    = caps.codecs.filter(c => c.mimeType === 'video/VP9');
          const others = caps.codecs.filter(c => !['video/H264','video/VP8','video/VP9'].includes(c.mimeType));
          const ordered = [...h264, ...vp8, ...vp9, ...others];
          if (ordered.length) t.setCodecPreferences(ordered);
        }
      } catch { /* setCodecPreferences not supported */ }
    }

    // ── Force high bitrate via RTCRtpSender.setParameters ────────────────────
    //   Called once connection reaches 'connected' state.
    //   degradationPreference:'disabled' = never reduce resolution OR framerate.
    //   On LAN there is no real congestion so this is safe.
    async function applyEncodingParams(pc) {
      for (const sender of pc.getSenders()) {
        if (sender.track?.kind !== 'video') continue;
        try {
          const params = sender.getParameters();
          if (!params.encodings?.length) params.encodings = [{}];
          Object.assign(params.encodings[0], {
            maxBitrate:            50_000_000, // 50 Mbps — no limits on LAN
            maxFramerate:          60,
            priority:              'high',
            networkPriority:       'high',
            degradationPreference: 'disabled', // never degrade quality or fps
          });
          await sender.setParameters(params);
        } catch {
          // 'disabled' not supported on older Chrome — fall back to maintain-resolution
          try {
            const params = sender.getParameters();
            if (params.encodings?.length) {
              params.encodings[0].maxBitrate = 50_000_000;
              params.encodings[0].maxFramerate = 60;
              params.encodings[0].degradationPreference = 'maintain-resolution';
              await sender.setParameters(params);
            }
          } catch { /* ignore */ }
        }
      }
    }

    // ── Peer management ───────────────────────────────────────────────────────

    function createPeer(viewerId) {
      if (peers.has(viewerId)) { peers.get(viewerId).close(); peers.delete(viewerId); }

      const pc = new RTCPeerConnection(iceConfig);

      pc.onicecandidate = ({ candidate }) => {
        if (candidate) socket.emit('ice-candidate', { targetId: viewerId, candidate });
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') applyEncodingParams(pc);
        if (['failed','closed'].includes(pc.connectionState)) peers.delete(viewerId);
      };

      peers.set(viewerId, pc);
      return pc;
    }

    function closeAllPeers() { peers.forEach(pc => pc.close()); peers.clear(); }

    async function sendOfferTo(viewerId) {
      if (!localStream?.active) return;

      const pc = createPeer(viewerId);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      applyCodecPreference(pc);

      try {
        const raw    = await pc.createOffer();
        const sdp    = patchSdpForLAN(raw.sdp);
        const offer  = new RTCSessionDescription({ type: 'offer', sdp });
        await pc.setLocalDescription(offer);
        socket.emit('offer', { targetId: viewerId, sdp: pc.localDescription });
      } catch (e) {
        console.error('Offer error:', e);
      }
    }

    // ── Socket ────────────────────────────────────────────────────────────────

    socket.on('connect', () => {
      clearError();
      if (!localStream) btnStart.disabled = false;
      socket.emit('register-broadcaster');
      if (localStream?.active) socket.emit('start-broadcast');
    });

    socket.on('redirect-to-viewer', () => { window.location.href = '/watch'; });

    socket.on('disconnect', () => {
      btnStart.disabled = true;
    });

    socket.on('viewer-joined', ({ viewerId }) => sendOfferTo(viewerId));

    socket.on('viewer-left', ({ viewerId }) => {
      const pc = peers.get(viewerId);
      if (pc) { pc.close(); peers.delete(viewerId); }
    });

    socket.on('answer', async ({ fromId, sdp }) => {
      const pc = peers.get(fromId);
      if (!pc) return;
      try { await pc.setRemoteDescription(new RTCSessionDescription(sdp)); }
      catch (e) { console.error('Answer error:', e); }
    });

    socket.on('ice-candidate', async ({ fromId, candidate }) => {
      const pc = peers.get(fromId);
      if (!pc || !candidate) return;
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch { }
    });

    // ── Controls ──────────────────────────────────────────────────────────────

    btnStart.addEventListener('click', async () => {
      clearError();
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            width:     { ideal: 3840 },
            height:    { ideal: 2160 },
            frameRate: { ideal: 60 },
            cursor:    'always',
          },
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl:  false,
            sampleRate:       48000,
            channelCount:     2,
          },
        });
      } catch (e) {
        if (e.name !== 'NotAllowedError') showError('No se pudo capturar la pantalla: ' + e.message);
        return;
      }

      const videoTrack = localStream.getVideoTracks()[0];

      // 'detail' = encoder optimises for sharpness/text legibility (screen share ideal)
      videoTrack.contentHint = 'detail';

      // Force 60 fps on the track (some browsers default to 15)
      try { await videoTrack.applyConstraints({ frameRate: { ideal: 60 } }); } catch { }

      preview.srcObject = localStream;
      placeholder.style.display = 'none';
      btnStart.disabled = true;
      btnStop.disabled = false;

      socket.emit('start-broadcast');

      localStream.getVideoTracks()[0].addEventListener('ended', stopStreaming);
    });

    btnStop.addEventListener('click', stopStreaming);

    function stopStreaming() {
      if (!localStream) return;
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
      socket.emit('stop-broadcast');
      closeAllPeers();
      preview.srcObject = null;
      placeholder.style.display = 'flex';
      btnStart.disabled = false;
      btnStop.disabled = true;
    }
  </script>
</body>
</html>
