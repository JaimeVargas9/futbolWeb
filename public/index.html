<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN Streamer — Emisor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3248;
      --accent: #4f6ef7;
      --accent-hover: #6b84ff;
      --danger: #e05252;
      --danger-hover: #f06060;
      --text: #e8eaf0;
      --text-muted: #8b8fa8;
      --green: #3ecf8e;
      --yellow: #f5a623;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.streaming { background: var(--accent); animation: pulse 1.5s infinite; }
    .status-dot.error     { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #status-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .viewer-badge {
      margin-left: auto;
      background: var(--border);
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .viewer-badge strong {
      color: var(--text);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    button:active { transform: scale(0.97); }

    #btn-start {
      background: var(--accent);
      color: #fff;
    }
    #btn-start:hover:not(:disabled) { background: var(--accent-hover); }

    #btn-stop {
      background: var(--danger);
      color: #fff;
    }
    #btn-stop:hover:not(:disabled) { background: var(--danger-hover); }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Preview */
    .preview-wrapper {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }

    #preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 0.5rem;
    }

    .preview-placeholder svg {
      opacity: 0.4;
    }

    /* Watch link */
    .watch-link-section label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .watch-link-row {
      display: flex;
      gap: 0.5rem;
    }

    #watch-url {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: var(--text);
      font-size: 0.85rem;
      font-family: monospace;
    }

    #watch-url:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    #btn-copy {
      background: var(--border);
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.6rem 1rem;
    }

    #btn-copy:hover { background: #3a3f5c; }

    /* Error banner */
    #error-banner {
      display: none;
      background: #3b1c1c;
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: #f5b0b0;
    }

    /* Live region for screen readers */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>LAN Streamer</h1>
    <p>Emite tu pantalla a cualquier dispositivo en la red local</p>
  </header>

  <main>
    <!-- Status -->
    <section class="card status-bar" aria-label="Estado de conexión">
      <span class="status-dot" id="status-dot" aria-hidden="true"></span>
      <span id="status-text">Conectando al servidor…</span>
      <span class="viewer-badge" aria-label="Espectadores conectados">
        <strong id="viewer-count">0</strong> espectadores
      </span>
    </section>

    <!-- Error -->
    <div id="error-banner" role="alert" aria-live="assertive"></div>

    <!-- Controls -->
    <section class="card controls" aria-label="Controles de emisión">
      <button id="btn-start" disabled aria-label="Compartir pantalla y comenzar emisión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Compartir pantalla
      </button>
      <button id="btn-stop" disabled aria-label="Detener emisión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
        Detener
      </button>
    </section>

    <!-- Preview -->
    <section class="card" aria-label="Vista previa de la emisión">
      <h2 style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:.06em">
        Vista previa
      </h2>
      <div class="preview-wrapper">
        <video id="preview" autoplay playsinline muted
               aria-label="Vista previa de la pantalla compartida"></video>
        <div class="preview-placeholder" id="preview-placeholder" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Sin emisión activa</span>
        </div>
      </div>
    </section>

    <!-- Watch link -->
    <section class="card watch-link-section" aria-label="Enlace para espectadores">
      <h2 style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:.06em">
        Enlace para espectadores
      </h2>
      <label for="watch-url">Comparte esta URL en tu red local:</label>
      <div class="watch-link-row">
        <input type="text" id="watch-url" readonly aria-label="URL de visualización" />
        <button id="btn-copy" aria-label="Copiar URL al portapapeles">Copiar</button>
      </div>
    </section>
  </main>

  <!-- Live region for screen readers -->
  <div aria-live="polite" aria-atomic="true" class="sr-only" id="sr-live"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const btnStart     = document.getElementById('btn-start');
    const btnStop      = document.getElementById('btn-stop');
    const preview      = document.getElementById('preview');
    const placeholder  = document.getElementById('preview-placeholder');
    const statusDot    = document.getElementById('status-dot');
    const statusText   = document.getElementById('status-text');
    const viewerCount  = document.getElementById('viewer-count');
    const errorBanner  = document.getElementById('error-banner');
    const watchUrl     = document.getElementById('watch-url');
    const btnCopy      = document.getElementById('btn-copy');
    const srLive       = document.getElementById('sr-live');

    // Map: viewerId → RTCPeerConnection
    const peers = new Map();
    let localStream = null;

    const iceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ],
    };

    // Populate watch URL
    watchUrl.value = `${location.protocol}//${location.hostname}:${location.port}/watch`;

    // ── Helpers ──────────────────────────────────────────────────────────────

    function setStatus(text, state) {
      statusText.textContent = text;
      statusDot.className = 'status-dot ' + (state || '');
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function clearError() {
      errorBanner.textContent = '';
      errorBanner.style.display = 'none';
    }

    function announce(msg) {
      srLive.textContent = '';
      requestAnimationFrame(() => { srLive.textContent = msg; });
    }

    // ── Socket events ─────────────────────────────────────────────────────────

    socket.on('connect', () => {
      setStatus('Conectado al servidor', 'connected');
      btnStart.disabled = false;
      socket.emit('register-broadcaster');
      clearError();
    });

    socket.on('disconnect', () => {
      setStatus('Desconectado. Reconectando…', 'error');
      btnStart.disabled = true;
    });

    socket.on('connect_error', () => {
      setStatus('Error de conexión', 'error');
    });

    socket.on('viewer-count', (count) => {
      viewerCount.textContent = count;
      announce(`${count} espectador${count !== 1 ? 'es' : ''} conectado${count !== 1 ? 's' : ''}`);
    });

    // New viewer joined → create peer and send offer
    socket.on('viewer-joined', async ({ viewerId }) => {
      if (!localStream) return;
      const pc = createPeer(viewerId);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { targetId: viewerId, sdp: pc.localDescription });
      } catch (e) {
        console.error('Offer error:', e);
      }
    });

    socket.on('viewer-left', ({ viewerId }) => {
      closePeer(viewerId);
    });

    socket.on('answer', async ({ fromId, sdp }) => {
      const pc = peers.get(fromId);
      if (!pc) return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      } catch (e) {
        console.error('Answer error:', e);
      }
    });

    socket.on('ice-candidate', async ({ fromId, candidate }) => {
      const pc = peers.get(fromId);
      if (!pc || !candidate) return;
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) {
        // Silently ignore non-fatal ICE errors
      }
    });

    // ── Peer management ───────────────────────────────────────────────────────

    function createPeer(viewerId) {
      if (peers.has(viewerId)) closePeer(viewerId);

      const pc = new RTCPeerConnection(iceConfig);

      pc.onicecandidate = ({ candidate }) => {
        if (candidate) {
          socket.emit('ice-candidate', { targetId: viewerId, candidate });
        }
      };

      pc.onconnectionstatechange = () => {
        if (['failed', 'closed'].includes(pc.connectionState)) {
          closePeer(viewerId);
        }
      };

      peers.set(viewerId, pc);
      return pc;
    }

    function closePeer(viewerId) {
      const pc = peers.get(viewerId);
      if (pc) {
        pc.close();
        peers.delete(viewerId);
      }
    }

    function closeAllPeers() {
      peers.forEach((pc) => pc.close());
      peers.clear();
    }

    // ── Controls ──────────────────────────────────────────────────────────────

    btnStart.addEventListener('click', async () => {
      clearError();
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30, cursor: 'always' },
          audio: true,
        });
      } catch (e) {
        if (e.name !== 'NotAllowedError') {
          showError('No se pudo capturar la pantalla: ' + e.message);
        }
        return;
      }

      preview.srcObject = localStream;
      placeholder.style.display = 'none';
      btnStart.disabled = true;
      btnStop.disabled = false;
      setStatus('Emitiendo', 'streaming');
      announce('Emisión iniciada');

      // Handle user stopping via browser's native "Stop sharing" button
      localStream.getVideoTracks()[0].addEventListener('ended', stopStreaming);
    });

    btnStop.addEventListener('click', stopStreaming);

    function stopStreaming() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      preview.srcObject = null;
      placeholder.style.display = 'flex';
      closeAllPeers();
      btnStart.disabled = false;
      btnStop.disabled = true;
      setStatus('Detenido', 'connected');
      announce('Emisión detenida');

      // Re-register so new viewers can be notified
      socket.emit('register-broadcaster');
    }

    // ── Copy URL ──────────────────────────────────────────────────────────────

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(watchUrl.value);
        const prev = btnCopy.textContent;
        btnCopy.textContent = '¡Copiado!';
        btnCopy.setAttribute('aria-label', 'URL copiada al portapapeles');
        setTimeout(() => {
          btnCopy.textContent = prev;
          btnCopy.setAttribute('aria-label', 'Copiar URL al portapapeles');
        }, 2000);
      } catch {
        watchUrl.select();
        document.execCommand('copy');
      }
    });
  </script>
</body>
</html>
